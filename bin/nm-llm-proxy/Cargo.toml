[package]
name = "nm-llm-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "本机 OpenAI 兼容 HTTP → nanomesh P2P model.infer（多 provider）"

[[bin]]
name = "nm-llm-proxy"
path = "src/main.rs"

[lib]
name = "nm_llm_proxy"
path = "src/lib.rs"

[dependencies]
nm-client = { workspace = true }
nm-proto = { workspace = true }
nm-transport = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
prost = "0.14"
base64 = "0.22"
dashmap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
