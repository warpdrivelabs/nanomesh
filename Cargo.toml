[workspace]
resolver = "2"
members = [
    "crates/nm-proto",
    "crates/nm-core",
    "crates/nm-transport",
    "crates/nm-store",
    "crates/nm-gossip",
    "crates/nm-federation",
    "crates/nm-crypto",
    "crates/nm-entity",
    "crates/nm-node",
    "crates/nm-client",
    "crates/nm-gateway",
    "bin/nmd",
    "bin/nm-gatewayd",
    "bin/nm-agent",
    "bin/nm-echo",
    "bin/nm-admind",
    "bin/nm-domain",
    "xtask",
]
exclude = ["old_space", "clients"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# --- internal ---
nm-proto      = { path = "crates/nm-proto" }
nm-core       = { path = "crates/nm-core" }
nm-transport  = { path = "crates/nm-transport" }
nm-store      = { path = "crates/nm-store" }
nm-gossip     = { path = "crates/nm-gossip" }
nm-federation = { path = "crates/nm-federation" }
nm-crypto     = { path = "crates/nm-crypto" }
nm-entity     = { path = "crates/nm-entity" }
nm-node       = { path = "crates/nm-node" }
nm-client     = { path = "crates/nm-client" }
nm-gateway    = { path = "crates/nm-gateway" }
# --- runtime / util ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
axum = "0.8"
# --- iroh 去中心网络栈 ---
# 对齐到 iroh 1.3（最新稳定）：iroh/iroh-base/iroh-dns 同为 1.3.x；
# iroh-gossip / iroh-docs 0.101 均要求 iroh ^1，故与 1.3 兼容对齐。
iroh = "1.3"
iroh-gossip = "0.101"
iroh-docs = "0.101"
iroh-dns = "1.3"   # F2：复用其 pkarr::SignedPacket 发布/解析「群公钥 → seed 节点」发现记录
# --- 存储 / 加密 ---
redb = "4"
blake3 = "1"
argon2 = "0.6"

[patch.crates-io]
native-tls = { path = "vendor/native-tls-0.2.18" }
