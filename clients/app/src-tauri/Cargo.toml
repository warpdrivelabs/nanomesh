[package]
name = "nmspace-app"
version = "0.1.0"
edition = "2024"
description = "nmspace desktop/mobile app"
license = "MIT OR Apache-2.0"

# 独立于后端 workspace（根 Cargo.toml 已 exclude "clients"），用 `tauri` CLI 构建。
[lib]
name = "nmspace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
# 原生端进程内内嵌客户端核心（iroh）：
nm-client = { path = "../../../crates/nm-client" }
nm-transport = { path = "../../../crates/nm-transport" }
nm-entity = { path = "../../../crates/nm-entity" }
nm-proto = { path = "../../../crates/nm-proto" }
nm-crypto = { path = "../../../crates/nm-crypto" }
# 云模型共享：复用 OpenAI 兼容 Backend（一模型一身份上线）
nm-compute = { path = "../../../bin/nm-compute" }
# 智能体工作台(cmx-agent 库内嵌,零复制零改动,全参数化适配):git 依赖其 app façade。
# login=off 时构造不调 .auth()(其 CLI serve 同形态);=portal 时调 .auth() 恢复原版登录。
# 跟踪 main 最新(不锁 rev)。注意 cargo 仍会在 Cargo.lock 记住当前 commit——
# 要拉上游新提交:cargo update -p cmx-agent-app(或删 lock 对应段重建)。
# 本地有 checkout 时可用 path 覆盖(免拉网):
#   cmx-agent-app = { path = "../../../../../../cmx-workspace/backend/cmx-agent/crates/cmx-agent-app" }
cmx-agent-app = { git = "https://gitee.com/warpdrivelabs/cmx-agent.git", branch = "main" }
# zip 2.6 破坏 ZipFile API(semver 违规);cmx-agent-office 的 calamine 0.26 需 ≤2.5。
# 上游 calamine≥0.27 后可删本钉。勿 `cargo update -p zip` 升到 2.6+。
zip = { version = "=2.5.0", default-features = false, features = ["deflate"] }
tokio-stream = "0.1"  # cmx 工作台 SSE(/api/stream /api/subscribe)
prost = "0.14"
tracing = "0.1"
# 应用日志（换网/重连可观测）：滚动文件 + 控制台；默认 info，RUST_LOG 可覆盖。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 消费方本地 OpenAI 兼容代理（内嵌 axum）
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# 本地访问认证（P1）：主口令 Argon2id 派生 → XChaCha20-Poly1305 信封加密身份私钥
argon2 = "0.6"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
base64 = "0.22"
bip39 = "2"
# macOS 系统 TLS / rustls 访问 robot.link 会在握手时被重置，改用 OpenSSL。
openssl = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
tauri-plugin-notification = "2.5.1"

# 托盘配套：单实例唤起、开机自启、全局快捷键（仅桌面端）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"

# 设备口令存系统钥匙串（Android 无对应后端，退回 0600 文件）。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
