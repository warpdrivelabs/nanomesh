[package]
name = "nmspace-app"
version = "0.1.0"
edition = "2024"
description = "nmspace desktop/mobile app"
license = "MIT OR Apache-2.0"

# 独立于后端 workspace（根 Cargo.toml 已 exclude "clients"），用 `tauri` CLI 构建。
[lib]
name = "nmspace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 原生端进程内内嵌客户端核心（iroh）：
nm-client = { path = "../../../crates/nm-client" }
nm-transport = { path = "../../../crates/nm-transport" }
nm-entity = { path = "../../../crates/nm-entity" }
nm-proto = { path = "../../../crates/nm-proto" }
