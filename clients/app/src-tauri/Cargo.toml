[package]
name = "nmspace-app"
version = "0.1.0"
edition = "2024"
description = "nmspace desktop/mobile app"
license = "MIT OR Apache-2.0"

# 独立于后端 workspace（根 Cargo.toml 已 exclude "clients"），用 `tauri` CLI 构建。
[lib]
name = "nmspace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 原生端进程内内嵌客户端核心（iroh）：
nm-client = { path = "../../../crates/nm-client" }
nm-transport = { path = "../../../crates/nm-transport" }
nm-entity = { path = "../../../crates/nm-entity" }
nm-proto = { path = "../../../crates/nm-proto" }
# 本地访问认证（P1）：主口令 Argon2id 派生 → XChaCha20-Poly1305 信封加密身份私钥
argon2 = "0.6"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
base64 = "0.22"
bip39 = "2"
# macOS 系统 TLS / rustls 访问 robot.link 会在握手时被重置，改用 OpenSSL。
openssl = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"

# 设备口令存系统钥匙串（Android 无对应后端，退回 0600 文件）。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
