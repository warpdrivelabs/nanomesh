[package]
name = "nmspace-app"
version = "0.1.4"
edition = "2024"
description = "nmspace desktop/mobile app"
license = "MIT OR Apache-2.0"

# 独立于后端 workspace（根 Cargo.toml 已 exclude "clients"），用 `tauri` CLI 构建。
[lib]
name = "nmspace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["image-png", "macos-private-api", "tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
# 原生端进程内内嵌客户端核心（iroh）：
nm-client = { path = "../../../crates/nm-client" }
nm-transport = { path = "../../../crates/nm-transport" }
nm-entity = { path = "../../../crates/nm-entity" }
nm-proto = { path = "../../../crates/nm-proto" }
nm-crypto = { path = "../../../crates/nm-crypto" }
# 云模型共享：复用 OpenAI 兼容 Backend（一模型一身份上线）
nm-compute = { path = "../../../bin/nm-compute" }
# 智能体工作台(cmx-agent 库内嵌,零复制零改动,全参数化适配):git 依赖其 app façade。
# login=off 时构造不调 .auth()(其 CLI serve 同形态);=portal 时调 .auth() 恢复原版登录。
# **钉 rev**（不跟 main 浮动,保证可复现）：21602b2 = 2026-11-12 release 0.1.16
# （含 20261104 DemoModel 清退——未配置模型时不再有离线演示兜底；以及 1112 前的
#  会话归档、思考链路优化、插件手动激活、浏览器面板下沉等一批改动）。
# 注意：上游各 crate 启用 reqwest 的 `webpki-roots` feature——它只是
# reqwest 0.13.1 中可选依赖 webpki-roots 的隐式特性，0.13.4 起已移除；作为 git 依赖
# 消费时 cargo 会选最新 0.13.5，解析阶段即报 "feature `webpki-roots` does not exist"。
# 故下方用重命名直接依赖把 reqwest 0.13 线钉到 0.13.1（与上游自身 Cargo.lock 一致）。
# 升级：上游去掉该 feature 后可删本钉，并把两条 cmx 依赖的 rev 一起换新
# （必须同源同 rev，混合 source 会整树重复）。
cmx-agent-app = { git = "https://gitee.com/warpdrivelabs/cmx-agent.git", rev = "21602b2cce223a00e4ae3e002e3caf361217370d" }
# IM 遥控通道桥（飞书/QQ/微信入站 + 扫码登录）：组件「设置 → IM 遥控」面板的三条契约命令
# （im_config / im_wechat_login / im_qq_login）在 cmx_host 实现，须直接引用其 crate。
cmx-agent-im = { git = "https://gitee.com/warpdrivelabs/cmx-agent.git", rev = "21602b2cce223a00e4ae3e002e3caf361217370d" }
# 约束 cmx 依赖所需的 reqwest 0.13 线（见上）：不动本包自用的 reqwest 0.12 更新链。
# 0.13.1 与 iroh / tauri-plugin-updater 的 ^0.13 要求统一，不会出现双版本。
reqwest013 = { package = "reqwest", version = "=0.13.1", default-features = false }
tokio-stream = "0.1"  # cmx 工作台 SSE(/api/stream /api/subscribe)
prost = "0.14"
tracing = "0.1"
# 应用日志（换网/重连可观测）：滚动文件 + 控制台；默认 info，RUST_LOG 可覆盖。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 消费方本地 OpenAI 兼容代理（内嵌 axum）
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# 本地访问认证（P1）：主口令 Argon2id 派生 → XChaCha20-Poly1305 信封加密身份私钥
argon2 = "0.6"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
base64 = "0.22"
bip39 = "2"
# macOS 系统 TLS / rustls 访问 robot.link 会在握手时被重置，改用 OpenSSL。
# vendored：静态链接进二进制。系统 Homebrew 的 libssl 绝对路径分发即挂
# （无此路径 Library not loaded；hardened runtime 下 Homebrew 签名与本 app Team ID 不同被 dyld 拒载）。
openssl = { version = "0.10", features = ["vendored"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
tauri-plugin-notification = "2.5.1"
# wgc: Windows 用 Graphics Capture(WGC) 抓屏,输出物理像素;默认 GDI 路径在
# 非 PerMonitorV2 场景会抓到 DPI 虚拟化后的逻辑尺寸,高 DPI(175%)下截图被缩放。
xcap = { version = "0.9.10", default-features = false, features = ["wgc"] }
# 截图管线直用（xcap 间接带入，锁同版本）：选区裁剪 + JPEG 编码。
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# 托盘配套：单实例唤起、开机自启、全局快捷键（仅桌面端）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"
# 自动更新（与 cmx-agent 同款）：updater 插件（check/minisign 验签/三平台安装）
# + url/reqwest（update_common.rs 的断点下载器自用，rustls 不牵连本 app 的 OpenSSL 选型）。
# rustls：插件默认 reqwest 0.13 + rustls-no-provider，须进程级装 CryptoProvider 才能走
# HTTPS（本机 iroh 自管配置不会装 default）；给 ring，避免默认 features 拖进 aws-lc-rs。
tauri-plugin-updater = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# 设备口令存系统钥匙串（Android 无对应后端，退回 0600 文件）。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
