[package]
name = "nmspace-mobile"
version = "0.1.0"
edition = "2024"
description = "nmspace mobile app (Android/iOS, phone + tablet)"
license = "MIT OR Apache-2.0"

# 独立于后端 workspace（根 Cargo.toml 已 exclude "clients"），用 `tauri` CLI 构建。
[lib]
name = "nmspace_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
# 原生端进程内内嵌客户端核心（iroh）：
nm-client = { path = "../../../crates/nm-client" }
nm-transport = { path = "../../../crates/nm-transport" }
nm-entity = { path = "../../../crates/nm-entity" }
nm-proto = { path = "../../../crates/nm-proto" }
nm-crypto = { path = "../../../crates/nm-crypto" }
prost = "0.14"
# 本地访问认证（P1）：主口令 Argon2id 派生 → XChaCha20-Poly1305 信封加密身份私钥
argon2 = "0.6"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
base64 = "0.22"
bip39 = "2"
# 桌面端 OpenSSL 用系统库。Android 另见下方 vendored 依赖。
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
tauri-plugin-notification = "2.5.1"

# 托盘配套（单实例/自启/全局快捷键）+ OpenSSL(robot.link TLS)：仅桌面端。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
openssl = "0.10"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"

# 设备口令存系统钥匙串（Android 无对应后端，退回 0600 文件）。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

# iroh 仍用 rustls。注册中心 HTTPS 在 Android 上改走下方的 OpenSSL。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# robot.link 会重置 rustls 的握手，移动端用内置 OpenSSL，并读 Android 系统证书。
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
