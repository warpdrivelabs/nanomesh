[package]
name = "nm-agent-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "nanomesh 前门 façade：实现 cmx-agent 内核 ModelSeam，把模型调用接到 P2P 模型网络（C2）。A0 引用打通。"

# A0 说明：本 crate **不在** 主 workspace members 内（见根 Cargo.toml exclude），
# 以便主干构建（nmd 等，供测试者 pull）完全不受 cmx-agent 外部依赖影响；独立构建：
#   cargo build  --manifest-path crates/nm-agent-bridge/Cargo.toml
#   cargo test   --manifest-path crates/nm-agent-bridge/Cargo.toml

[dependencies]
# cmx-agent 内核（完整引用、不改一行）：core = 回合循环/工具路由/守卫/会话事件/ModelSeam；
# tools = 内置工具平面。二者**零网络**（serde/async-trait/tokio/chrono/regex/walkdir/…）。
# 以 git rev 固定引用（可移植、随上游改 rev/tag 升级；rev 85fa2a6 已在 origin/main，公网可 clone、已验证 build+test 绿）。
# 本地开发（有 cmx-agent 同级 checkout、免 clone）可临时改为 path：
#   cmx-agent-core  = { path = "../../../../../cmx-workspace/backend/cmx-agent/crates/cmx-agent-core" }
#   cmx-agent-tools = { path = "../../../../../cmx-workspace/backend/cmx-agent/crates/cmx-agent-tools" }
# cmx-agent-mcp（远程 MCP host，携 reqwest+rustls 网络栈）非 ModelSeam 所需，留待后续里程碑单独引用。
cmx-agent-core = { git = "https://gitee.com/warpdrivelabs/cmx-agent.git", rev = "85fa2a6" }
cmx-agent-tools = { git = "https://gitee.com/warpdrivelabs/cmx-agent.git", rev = "85fa2a6" }
async-trait = "0.1"
serde_json = "1"
# —— feature `nm-client`：真实 P2P（SessionInferChannel 走 nm-client C2）+ nm-agentd 可执行 agent ——
# 默认关 → 纯 ModelSeam/A0 消费者保持轻、无 iroh；开 `--features nm-client` 才拉下面这组 + nm-agentd bin。
# 全 optional、经 feature 一次性开启（bin 是 normal 目标，其依赖须为 normal 而非 dev）。
nm-client = { path = "../nm-client", optional = true }
nm-entity = { path = "../nm-entity", optional = true }
nm-proto = { path = "../nm-proto", optional = true }
nm-transport = { path = "../nm-transport", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "io-std", "io-util", "time"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }

[features]
# 开启后编译 SessionInferChannel + nm-agentd（经 nm-client C2 走真实 P2P 节点）。
nm-client = [
    "dep:nm-client", "dep:nm-entity", "dep:nm-proto", "dep:nm-transport",
    "dep:tokio", "dep:clap", "dep:tracing-subscriber", "dep:anyhow",
]

# nm-agentd：在一个 nmspace 节点上真跑一个 cmx-agent 智能体（模型经 P2P 取得）。需 feature=nm-client。
[[bin]]
name = "nm-agentd"
path = "src/bin/nm-agentd.rs"
required-features = ["nm-client"]

[dev-dependencies]
# A1 端到端测试（tests/e2e_p2p_seam.rs，门控 feature=nm-client）：仅补测试独有的 node/compute + tokio 测试宏；
# nm-client/entity/proto/transport 由 feature=nm-client 作为 normal 依赖提供。
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
nm-node = { path = "../nm-node" }
nm-compute = { path = "../../bin/nm-compute" }

# 本 crate 独立（exclude）构建 → 根 Cargo.toml 的 [patch] 不生效；nm-node/nm-compute 的 reqwest 走
# native-tls，需在此自带同款 vendored patch（与根一致）才能复用离线版本、避免版本分叉。
[patch.crates-io]
native-tls = { path = "../../vendor/native-tls-0.2.18" }
