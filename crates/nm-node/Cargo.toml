[package]
name = "nm-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nm-proto = { workspace = true }
nm-core = { workspace = true }
nm-transport = { workspace = true }
nm-store = { workspace = true }
nm-gossip = { workspace = true }
nm-federation = { workspace = true }
nm-crypto = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }   # 优雅关闭：CancellationToken(sync) + TaskTracker(rt)
tracing = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
iroh-dns = { workspace = true }   # F2 pkarr 群发现记录编解码
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }  # F2：pkarr relay PUT/GET（服务端，native-tls 同 nm-admind）
serde = { workspace = true }
serde_json = { workspace = true }
prost = "0.14"
argon2 = { workspace = true }
pkarr = { version = "8.1.0", default-features = false, features = ["dht"] }  # P2-12 Phase B：真 Mainline DHT(trustless 发现叠加层)
bytes = { workspace = true }  # pkarr SignedPacket relay-payload 桥(Bytes)

[dev-dependencies]
nm-client = { workspace = true }
nm-entity = { workspace = true }
tempfile = "3"
tracing-subscriber = { workspace = true }
axum = { workspace = true }   # F2：pkarr mock relay（本地验证 publish/resolve）
mainline = "8"                # P2-12 Phase B：本地 DHT Testnet(#[ignore] e2e)
