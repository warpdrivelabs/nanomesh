syntax = "proto3";

package nmspace.v1;

// 类型化载荷信封（自定义 Any，避免依赖 google.protobuf.Any）。
// type_url 形如 "nmspace.v1/agent.assistant"，决定 value 如何解码。
message Any {
  string type_url = 1;
  bytes value = 2;
}

// 交互能力：声明一个实体支持哪些交互模式，路由层据此泛化处理。
// 值前缀 CAPABILITY_ 用于避免 proto 文件级枚举值命名冲突；prost 会剥离前缀，
// 生成的 Rust 变体为 Capability::Message / Capability::Command 等。
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_MESSAGE = 1;        // 人/Agent 聊天、通知
  CAPABILITY_PRESENCE = 2;       // 在线状态
  CAPABILITY_TELEMETRY_PUB = 3;  // 发布遥测
  CAPABILITY_TELEMETRY_SUB = 4;  // 订阅遥测
  CAPABILITY_COMMAND = 5;        // 接受命令(RPC)
  CAPABILITY_JOB = 6;            // 接受任务(长运行)
  CAPABILITY_STREAM = 7;         // 流式数据
}

// 统一实体：人 / AI Agent / 物联网设备 / 车辆 / 算力服务 / 自定义，皆用此结构。
message Entity {
  bytes entity_id = 1;                 // Ed25519 公钥（统一身份）
  string kind = 2;                     // 命名空间字符串，如 "agent.assistant"、"compute.inference"
  string display_name = 3;
  map<string, string> attributes = 4;  // 发现标签：region / gpu / model / status ...
  repeated Capability capabilities = 5;
  Any profile = 6;                     // 按 kind 的结构化档案
  int64 updated_at = 7;
  bytes signature = 8;                 // 由 entity_id 自签名，防篡改
  bytes home_node = 9;                 // 归属节点 EntityId（联邦寻址：该实体在此节点在线）
}

// ---- 内置类型的结构化档案（示例；自定义类型自带 Profile 即可）----
message PersonProfile {
  string avatar_url  = 1;  // 头像引用：现兼容 URL；P1 起改内容寻址 "b3:<blake3-hex>"
  string bio         = 2;  // 简介 / 个性签名
  string status_text = 3;  // 自定义状态 / 心情（如"在开会"）
  repeated string links = 4; // 主页 / 社交链接
  string locale      = 5;  // 语言 / 地区偏好（如 zh-CN）
}
message AgentProfile {
  string backend = 1;              // 模型/供应商
  repeated string tools = 2;       // 暴露的工具/函数
  bytes owner = 3;                 // 归属用户 EntityId（代理执行）
  string autonomy = 4;             // interactive / autonomous
}
message InferenceProfile {
  repeated string models = 1;
  uint32 max_context = 2;
  uint32 concurrency = 3;
  string price = 4;
}
message DeviceProfile {
  string device_type = 1;
  string firmware = 2;
}

// gram 类型标签。分组：会话 1-9 / P2P 10-19 / 群组 20-29 / 频道 30-39 / 联邦 40-49。
enum GramKind {
  GRAM_KIND_UNSPECIFIED = 0;
  GRAM_KIND_HELLO = 1;
  GRAM_KIND_LOGIN = 2;
  GRAM_KIND_LOGOUT = 3;
  GRAM_KIND_PING = 4;
  GRAM_KIND_PONG = 5;
  GRAM_KIND_PRESENCE = 6;
  GRAM_KIND_MESSAGE = 10;
  GRAM_KIND_RECEIPT = 11;
  GRAM_KIND_REPLY = 12;
  GRAM_KIND_TYPING = 13;
  GRAM_KIND_COMMAND = 14;
  GRAM_KIND_COMMAND_RESULT = 15;
  GRAM_KIND_GROUP_MESSAGE = 20;
  GRAM_KIND_GROUP_RECEIPT = 21;
  GRAM_KIND_GROUP_OP = 22;
  GRAM_KIND_CHANNEL_PUBLISH = 30;
  GRAM_KIND_CHANNEL_SUB = 31;
  GRAM_KIND_CHANNEL_UNSUB = 32;
  GRAM_KIND_CHANNEL_BACKFILL = 33;
  GRAM_KIND_RELAY = 40;
  GRAM_KIND_STATE_SYNC = 41;
  GRAM_KIND_NODE_HELLO = 42;
  GRAM_KIND_HEARTBEAT = 43;
}

// 统一消息封包（线协议）。载荷升级为 Any，承载各交互模式/类型的强类型 payload。
message Gram {
  uint32 version = 1;
  GramKind kind = 2;
  uint64 gram_id = 3;
  optional uint64 ref_gram_id = 4;
  bytes sender = 5;         // 32 字节 EntityId
  bytes receiver = 6;       // 32 字节：user/group/channel/node/service，按 kind 解释
  uint64 timestamp_ms = 7;
  Any payload = 8;          // 类型化载荷（启用 E2E 时 value 为密文）
  bytes crc = 9;            // blake3(payload.value)，32 字节
}

// ---- 交互模式载荷 ----
// Command / RPC（控制设备、调用工具/服务）
message Command { string method = 1; Any params = 2; uint64 correlation_id = 3; uint32 timeout_ms = 4; Grant grant = 5; }
message CommandResult { uint64 correlation_id = 1; bool ok = 2; Any result = 3; string error = 4; uint32 seq = 5; bool done = 6; }

// 目录（Directory）查询与结果（E1：实体注册 + 发现）。
message DirectoryQuery {
  string kind_prefix = 1;                       // 如 "compute." 命中训练+推理；"" 匹配全部
  repeated Capability require_capabilities = 2; // 须同时具备的能力
  map<string, string> match_attributes = 3;     // 须精确匹配的属性
}
message EntityList { repeated Entity entities = 1; }

// 联邦：s2s 目录同步（拉取远端已知实体，用于跨节点发现）。
message FedSyncReq { int64 since = 1; }               // 预留增量：updated_at > since
message FedSyncResp { repeated Entity entities = 1; }

// 内容寻址 blob（P1：头像等媒体，避免内联撑爆目录/gossip）。hash = blake3(data)，32 字节。
// blob.put 参数=BlobPut，结果=BlobRef；blob.get 参数=BlobRef，结果=BlobData。
message BlobPut  { bytes data = 1; string mime = 2; }
message BlobRef  { bytes hash = 1; bytes home_node = 2; } // home_node：本节点未命中时据此 s2s 回源
message BlobData { bytes hash = 1; bytes data = 2; string mime = 3; }

// 群组：有成员表的封闭会话（成员可为任意实体：人 / Agent / 设备 …）。
message Group {
  bytes group_id = 1;                 // 32 字节群标识
  string name = 2;
  bytes owner = 3;                    // 创建者 EntityId（权限最高）
  repeated bytes members = 4;         // 成员 EntityId 列表（含 owner）
  int64 updated_at = 5;
  repeated bytes admins = 6;          // 管理员 EntityId 列表（owner 不必在内；owner > admin > member）
  string topic = 7;                   // 群简介 / 公告
  string avatar_url = 8;              // 群头像："b3:<hash>"（内容寻址，blob 存 home_node）或内联 data:URI
  bytes home_node = 9;                // 群归属节点（头像 blob 所在；跨节点 blob_get 寻址用）
  bool supports_per_topic = 10;       // F1 协商：announce 源节点广告自身支持「每群独立主题」；收端据此跟踪可 per_topic 节点（非群状态，仅能力广告）。老节点不填=false=仅火管，向后兼容。
}
// 群操作参数（method=group.create/join/leave/kick/set_meta/list 时装入 Command.params）。
message GroupOp {
  bytes group_id = 1;
  string name = 2;                    // create / set_meta 用
  bytes target = 3;                   // kick/add/promote/demote 用：目标成员
  string topic = 4;                   // set_meta 用：群简介
  string avatar_url = 5;              // set_meta 用：群头像引用
  bytes secret = 6;                   // F2 create 用：群签名私钥(32)。group_id 须等于其公钥；home 节点存本地供 pkarr 发布，绝不回播。空=传统群(仅火管发现)。
}
message GroupList { repeated Group groups = 1; }

// ── 去中心命名（N1：home node 委派 local@domain）──────────────────────────
// 域属主节点对「local-part → 客户端公钥」签名背书；经联邦 gossip 复制，任一节点可解析。
// 域内唯一由 home node 权威保证；域全局唯一留待 N2（见证注册表）。详见 docs/MESH_DNS_NAMING_DESIGN.md。
message NameRecord {
  string local_part    = 1;           // 归一化本地部，如 nanomesh.215
  string domain        = 2;           // home node 自声明域名，如 jeff.nm（N1 为 TOFU）
  bytes  client_pubkey = 3;           // 目标客户端实体公钥（= name 指向）
  uint64 serial        = 4;           // 单调递增；同名新签覆盖旧
  int64  issued_at     = 5;
  uint32 ttl           = 6;           // 解析缓存秒数
  bytes  home_node     = 7;           // 签发者（域属主）节点公钥
  bytes  home_sig      = 8;           // Sign(home_node 私钥, 规范字节)；自证明委派
}
message NameOp   { string local_part = 1; }              // name.claim 参数
message NameQuery { string name = 1; bytes pubkey = 2; } // name.resolve(name) / name.reverse(pubkey)
message NameList { repeated NameRecord records = 1; }     // name.list / 解析结果

// ── 多设备（账号密钥 AK 给每台设备的连接密钥 DK 签证书）──────────────────────
// 设备用 DK 连接，出示证书后节点把该连接的主体视为 account；群/名字/目录仍以 account 为准。
// 签名输入见 nm-crypto::device_cert_bytes / device_revoke_bytes（sig 清空后的编码 + 域分隔前缀）。
message DeviceCert {
  bytes  account   = 1;               // 账号公钥 AK
  bytes  device    = 2;               // 设备连接公钥 DK
  string label     = 3;               // 设备名（签发时）
  string role      = 4;               // "admin"（持有 AK）| "member"
  int64  issued_at = 5;               // unix ms
  bytes  sig       = 6;               // Sign(AK)
}
// 吊销：by_node 为空时由 AK 签名；非空时为账号家节点凭账号口令代为冻结，由该节点签名。
message DeviceRevoke {
  bytes  account    = 1;
  bytes  device     = 2;
  int64  revoked_at = 3;              // unix ms
  string reason     = 4;
  bytes  by_node    = 5;
  bytes  sig        = 6;
}
message DeviceInfo {
  DeviceCert cert      = 1;
  string     label     = 2;           // 当前设备名（可改名，覆盖证书里的 label）
  int64      last_seen = 3;           // unix ms；在线时为最近一次上线时间
  bool       online    = 4;
  DeviceRevoke revoked = 5;           // 已吊销时有值
}
message DeviceList { repeated DeviceInfo devices = 1; }

// 群/私聊/命名 联邦 gossip 信封（联邦级主题 nmspace-groups:<fed>，所有节点加入）：
// 群状态发现(announce)、群消息扇出(msg)、私聊单播跨节点投递(direct)、命名记录复制(name)——
// 统一取代跨节点 s2s 中继（NAT 下常不通）；origin 防自回环。
// TODO：签名 + 每群独立主题 + 端到端加密（当前明文广播到联邦各节点）。
message GroupGossip {
  bytes origin = 1;                   // 广播源节点 id（收到 origin==自身则忽略）
  oneof body {
    Group announce = 2;               // 群状态广播（发现 + 成员表，home 节点周期/变更时发）
    Gram msg = 3;                     // 群消息扇出（kind=GroupMessage，receiver=group_id）
    Gram direct = 4;                  // 私聊单播（kind=Message，receiver=对端 EntityId）；仅在本地投递不了时才广播
    NameRecord name = 5;              // 命名记录复制（home 节点签发/周期重播，各节点据此填充命名缓存）
    DeviceRevoke revoke = 6;          // 设备吊销（自带签名，各节点验签后持久化并拒绝该设备）
    InboxLive inbox_live = 7;         // F3 退火管：收件人 home 在 nmspace-inbox:<account> 上的存活心跳；发送方据此（origin=该 home）判定可省略火管 Direct 副本
    DirectAck direct_ack = 8;         // 跨节点单聊可靠投递：对端 home 收到并落库 Direct 后，回发到 nmspace-inbox:<原sender>，发送方据此停持久重传
    GroupAck group_ack = 9;           // 跨节点群消息可靠扇出：成员节点收到并投递群 Msg 后，在群主题回发，发送方 home 据此按节点销账、停重传
    ChannelGram channel = 10;          // P4 频道火管兜底：频道 Meta/定序消息/发布意图经全节点火管广播一份（与频道专属主题双写），令跨节点订阅者的 home 无需频道 overlay 先成型即可收到（对齐群 announce 全网可见）
  }
}
// F3：收件人收件箱存活心跳。由收件人 home 节点在 nmspace-inbox:<account> 周期广播；
// origin(=该 home 节点 id) 由 GroupGossip 携带。发送方收到后记其存活，用于省略火管 Direct 副本。
message InboxLive {
  bytes account = 1;                  // 该收件箱对应的账号（= 主题标签，便于诊断）
  bool supports_direct_ack = 2;       // 能力协商：该 home 支持跨节点 Direct 的 E2E 确认（老节点=false=缺省）
}

// 跨节点单聊投递确认（E2E ack）：对端 home 收到并落库 Direct 后，发到 nmspace-inbox:<原sender>。
// 原 sender 的 home 本就订阅该主题 → 收到后删持久待确认条目、停重传。(sender,gram_id,crc) 唯一定位。
message DirectAck {
  bytes  sender   = 1;                // 原消息 sender（= 回执主题标签）
  uint64 gram_id  = 2;                // 原消息 gram_id
  bytes  receiver = 3;                // 原消息 receiver（outbox key 第二段，精确匹配）
  bytes  crc      = 4;                // 原消息 crc（防 client 重启 gram_id 回绕导致的误匹配）
}

// 跨节点群消息可靠扇出确认：成员的 home 节点收到群 Msg 并投递给本地成员后，在群主题 nmspace-group:<gid>
// （发送方 home 本就订阅以发群消息）回发此 ack。发送方 home 据 (gid,sender,gram_id) 定位待确认条目，
// 把 node 从「待 ack 节点集」移除；集合清空即停重传。按「节点」而非「成员」确认——一节点多成员只需一个 ack。
message GroupAck {
  bytes  gid     = 1;                 // 群 id（= 群主题标签）
  bytes  sender  = 2;                 // 原群消息 sender（与 gram_id 共同定位发送方的待确认条目）
  uint64 gram_id = 3;                 // 原群消息 gram_id
  bytes  crc     = 4;                 // 原消息 crc（防 client 重启 gram_id 回绕导致的误匹配）
  bytes  node    = 5;                 // 回执节点 id（= 发送方待 ack 节点集中要移除的那个成员 home 节点）
}

// 频道 / 主题（P4）：iroh-gossip 主题上的开放 pub/sub（1→N 广播，订阅制，大规模）。
// 与「群」区别：群=封闭成员表、双向、小规模；频道=开放订阅、广播、可海量订阅者。
// 定位：广播/公告（少写多读）。所有发布经频道 home 节点全局定序（分配单调 seq + home 签名），
// 订阅者只信 home 签名的 sequenced 消息；home 持 channel_id 对应私钥（CHANNEL_SECRETS，不广播）。
// 发布策略：open（任意订阅者可发）| owner_only（仅 owner，新建默认）。白名单留待后续。
enum PubPolicy {
  PUB_POLICY_OPEN = 0;                // 任意订阅者可发（旧行为）
  PUB_POLICY_OWNER_ONLY = 1;          // 仅 owner 可发（广播/公告默认）
}
message Channel {
  bytes channel_id = 1;               // 32 字节频道标识（keyed 频道 = home 持私钥的公钥）
  string name = 2;
  bytes owner = 3;                    // 创建者
  int64 created_at = 4;
  string topic = 5;                   // 频道简介/主题
  string avatar_url = 6;              // 频道头像："b3:<hash>" 或内联 data:URI
  bytes home_node = 7;                // 频道归属（定序器）节点；头像 blob 所在、跨节点解析用
  PubPolicy pub_policy = 8;           // 发布策略（默认 OPEN=0 保向后兼容；新建频道设 OWNER_ONLY）
  bool keyed = 9;                     // true=channel_id 为真实公钥、home 签名可验；false=legacy 随机 id（降级信任）
  uint64 earliest_seq = 10;           // home 日志裁剪后仍保有的最小 seq（晚加入者据此 clamp，低于此的历史不可得）
}
// 频道消息（home 定序后的权威广播 + 转发给订阅者）。seq 为频道级全局单调；home_sig 由 home 签。
message ChannelMsg {
  bytes channel_id = 1;
  bytes sender = 2;                   // 原发布者
  uint64 seq = 3;                     // 频道级全局单调序号（home 分配；排序/去重/回填游标唯一依据）
  int64 ts = 4;                       // 发布者本地时间戳（仅展示；排序以 seq 为准，防时钟偏移）
  string body = 5;
  bytes nonce = 6;                    // 发布者生成的幂等 nonce（publisher 据此匹配自己的 sequenced 消息、停重传）
  bytes home_sig = 7;                 // home 对消息规范字节的签名（订阅者强制验：防伪造帖抢占 seq 槽）
  bytes sender_sig = 8;               // 发布者对 PubReq 的签名（审计用；v1 订阅者不重验）
}
// 发布意图（未定序）：发布节点广播到频道主题，由 home 验权+分配 seq+签名后回广播 ChannelMsg。
message ChannelPubReq {
  bytes channel_id = 1;
  bytes sender = 2;
  int64 ts = 3;
  string body = 4;
  bytes nonce = 5;                    // 幂等键：home 的 CHANNEL_INTAKE 按 (cid,sender,nonce) 去重定序
  bytes sender_sig = 6;               // 发布者签名（home 验发布者身份）
}
// 发布被拒（home 签名的负 ack）：publisher 立即清 outbox + UI 提示，不再 24h 空等。
message ChannelPubReject {
  bytes channel_id = 1;
  bytes sender = 2;
  bytes nonce = 3;
  string reason = 4;                  // 如 "owner_only" / "bad_sig"
  bytes home_sig = 5;                 // home 签（publisher 仅认对 channel_id 可验的拒绝）
}
// 频道存活心跳：home 周期在频道主题广播，广告当前 seq 水位 + 定序能力（能力协商/混版回退）。
message ChannelLive {
  bytes channel_id = 1;
  uint64 max_seq = 2;                 // 当前最高 seq（订阅者据此发现断层/落后 → 触发回填）
  uint64 earliest_seq = 3;            // 日志下限（回填 clamp 依据）
  bool supports_sequencing = 4;       // 本 home 支持定序器（缺=老节点 → publisher 回退 legacy 直广播）
}
// 频道 gossip 载荷信封：消息/元信息/发布意图/回填/拒绝/心跳。老节点只认 msg|meta，其余忽略（向后兼容）。
message ChannelGram {
  oneof kind {
    ChannelMsg msg = 1;               // 一条（已定序）频道消息
    Channel meta = 2;                 // 频道元信息广播（home/已知者周期重播，晚订阅者据此补全）
    ChannelPubReq pub_req = 3;        // 发布意图（→ home 定序）
    ChannelBackfillReq backfill_req = 4; // 回填请求（→ home 应答 Log）
    ChannelLog log = 5;               // 回填应答（分页）
    ChannelPubReject reject = 6;      // 发布被拒（home → publisher）
    ChannelLive live = 7;             // home 存活/水位心跳
  }
}
message ChannelOp   { bytes channel_id = 1; string name = 2; string topic = 3; string avatar_url = 4; bytes secret = 5; } // create/sub/set_meta 参数；create 时 secret=频道私钥(32)，home 存 CHANNEL_SECRETS 供定序器签名，channel_id 须=其公钥
message ChannelPub  { bytes channel_id = 1; string body = 2; }                    // publish 参数
message ChannelList { repeated Channel channels = 1; }
message ChannelBackfillReq { bytes channel_id = 1; uint64 since_seq = 2; uint32 limit = 3; } // limit=0 用服务端默认
message ChannelLog  {
  repeated ChannelMsg msgs = 1;
  uint64 earliest_seq = 2;            // home 日志下限（client clamp contiguous，防无限回填已裁剪的历史）
  uint64 next_seq = 3;               // 下一页游标（more=true 时据此续拉）
  bool more = 4;                      // 是否还有更多（分页未尽）
}

// Job / 任务（算力网：训练、推理、批处理）
message ResourceReq { map<string, string> selectors = 1; }   // model / gpu / region / ...
message JobSpec { string job_type = 1; Any spec = 2; ResourceReq requirements = 3; }
message JobSubmit { bytes job_id = 1; JobSpec spec = 2; }
message JobEvent {
  bytes job_id = 1;
  enum State { STATE_QUEUED = 0; STATE_RUNNING = 1; STATE_PROGRESS = 2; STATE_SUCCEEDED = 3; STATE_FAILED = 4; STATE_CANCELED = 5; }
  State state = 2;
  float progress = 3;
  Any output = 4;
  string error = 5;
}

// 能力授权（代理/委托，UCAN 风格）：谁可对谁做什么，可过期/撤销/委托链。
message Grant {
  bytes issuer = 1;
  bytes audience = 2;
  string action = 3;
  string resource = 4;
  int64 expires = 5;
  bytes proof = 6;       // 上游委托链
  bytes signature = 7;
}
