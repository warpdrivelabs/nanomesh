syntax = "proto3";

package nmspace.v1;

// 类型化载荷信封（自定义 Any，避免依赖 google.protobuf.Any）。
// type_url 形如 "nmspace.v1/agent.assistant"，决定 value 如何解码。
message Any {
  string type_url = 1;
  bytes value = 2;
}

// 交互能力：声明一个实体支持哪些交互模式，路由层据此泛化处理。
// 值前缀 CAPABILITY_ 用于避免 proto 文件级枚举值命名冲突；prost 会剥离前缀，
// 生成的 Rust 变体为 Capability::Message / Capability::Command 等。
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_MESSAGE = 1;        // 人/Agent 聊天、通知
  CAPABILITY_PRESENCE = 2;       // 在线状态
  CAPABILITY_TELEMETRY_PUB = 3;  // 发布遥测
  CAPABILITY_TELEMETRY_SUB = 4;  // 订阅遥测
  CAPABILITY_COMMAND = 5;        // 接受命令(RPC)
  CAPABILITY_JOB = 6;            // 接受任务(长运行)
  CAPABILITY_STREAM = 7;         // 流式数据
}

// 统一实体：人 / AI Agent / 物联网设备 / 车辆 / 算力服务 / 自定义，皆用此结构。
message Entity {
  bytes entity_id = 1;                 // Ed25519 公钥（统一身份）
  string kind = 2;                     // 命名空间字符串，如 "agent.assistant"、"compute.inference"
  string display_name = 3;
  map<string, string> attributes = 4;  // 发现标签：region / gpu / model / status ...
  repeated Capability capabilities = 5;
  Any profile = 6;                     // 按 kind 的结构化档案
  int64 updated_at = 7;
  bytes signature = 8;                 // 由 entity_id 自签名，防篡改
  bytes home_node = 9;                 // 归属节点 EntityId（联邦寻址：该实体在此节点在线）
}

// ---- 内置类型的结构化档案（示例；自定义类型自带 Profile 即可）----
message PersonProfile {
  string avatar_url  = 1;  // 头像引用：现兼容 URL；P1 起改内容寻址 "b3:<blake3-hex>"
  string bio         = 2;  // 简介 / 个性签名
  string status_text = 3;  // 自定义状态 / 心情（如"在开会"）
  repeated string links = 4; // 主页 / 社交链接
  string locale      = 5;  // 语言 / 地区偏好（如 zh-CN）
}
message AgentProfile {
  string backend = 1;              // 模型/供应商
  repeated string tools = 2;       // 暴露的工具/函数
  bytes owner = 3;                 // 归属用户 EntityId（代理执行）
  string autonomy = 4;             // interactive / autonomous
}
message InferenceProfile {
  repeated string models = 1;
  uint32 max_context = 2;
  uint32 concurrency = 3;
  string price = 4;
}
message DeviceProfile {
  string device_type = 1;
  string firmware = 2;
}

// gram 类型标签。分组：会话 1-9 / P2P 10-19 / 群组 20-29 / 频道 30-39 / 联邦 40-49。
enum GramKind {
  GRAM_KIND_UNSPECIFIED = 0;
  GRAM_KIND_HELLO = 1;
  GRAM_KIND_LOGIN = 2;
  GRAM_KIND_LOGOUT = 3;
  GRAM_KIND_PING = 4;
  GRAM_KIND_PONG = 5;
  GRAM_KIND_PRESENCE = 6;
  GRAM_KIND_MESSAGE = 10;
  GRAM_KIND_RECEIPT = 11;
  GRAM_KIND_REPLY = 12;
  GRAM_KIND_TYPING = 13;
  GRAM_KIND_COMMAND = 14;
  GRAM_KIND_COMMAND_RESULT = 15;
  GRAM_KIND_GROUP_MESSAGE = 20;
  GRAM_KIND_GROUP_RECEIPT = 21;
  GRAM_KIND_GROUP_OP = 22;
  GRAM_KIND_CHANNEL_PUBLISH = 30;
  GRAM_KIND_CHANNEL_SUB = 31;
  GRAM_KIND_CHANNEL_UNSUB = 32;
  GRAM_KIND_CHANNEL_BACKFILL = 33;
  GRAM_KIND_RELAY = 40;
  GRAM_KIND_STATE_SYNC = 41;
  GRAM_KIND_NODE_HELLO = 42;
  GRAM_KIND_HEARTBEAT = 43;
}

// 统一消息封包（线协议）。载荷升级为 Any，承载各交互模式/类型的强类型 payload。
message Gram {
  uint32 version = 1;
  GramKind kind = 2;
  uint64 gram_id = 3;
  optional uint64 ref_gram_id = 4;
  bytes sender = 5;         // 32 字节 EntityId
  bytes receiver = 6;       // 32 字节：user/group/channel/node/service，按 kind 解释
  uint64 timestamp_ms = 7;
  Any payload = 8;          // 类型化载荷（启用 E2E 时 value 为密文）
  bytes crc = 9;            // blake3(payload.value)，32 字节
}

// ---- 交互模式载荷 ----
// Command / RPC（控制设备、调用工具/服务）
message Command { string method = 1; Any params = 2; uint64 correlation_id = 3; uint32 timeout_ms = 4; Grant grant = 5; }
message CommandResult { uint64 correlation_id = 1; bool ok = 2; Any result = 3; string error = 4; }

// 目录（Directory）查询与结果（E1：实体注册 + 发现）。
message DirectoryQuery {
  string kind_prefix = 1;                       // 如 "compute." 命中训练+推理；"" 匹配全部
  repeated Capability require_capabilities = 2; // 须同时具备的能力
  map<string, string> match_attributes = 3;     // 须精确匹配的属性
}
message EntityList { repeated Entity entities = 1; }

// 联邦：s2s 目录同步（拉取远端已知实体，用于跨节点发现）。
message FedSyncReq { int64 since = 1; }               // 预留增量：updated_at > since
message FedSyncResp { repeated Entity entities = 1; }

// 内容寻址 blob（P1：头像等媒体，避免内联撑爆目录/gossip）。hash = blake3(data)，32 字节。
// blob.put 参数=BlobPut，结果=BlobRef；blob.get 参数=BlobRef，结果=BlobData。
message BlobPut  { bytes data = 1; string mime = 2; }
message BlobRef  { bytes hash = 1; bytes home_node = 2; } // home_node：本节点未命中时据此 s2s 回源
message BlobData { bytes hash = 1; bytes data = 2; string mime = 3; }

// 群组：有成员表的封闭会话（成员可为任意实体：人 / Agent / 设备 …）。
message Group {
  bytes group_id = 1;                 // 32 字节群标识
  string name = 2;
  bytes owner = 3;                    // 创建者 EntityId（权限最高）
  repeated bytes members = 4;         // 成员 EntityId 列表（含 owner）
  int64 updated_at = 5;
  repeated bytes admins = 6;          // 管理员 EntityId 列表（owner 不必在内；owner > admin > member）
  string topic = 7;                   // 群简介 / 公告
  string avatar_url = 8;              // 群头像："b3:<hash>"（内容寻址，blob 存 home_node）或内联 data:URI
  bytes home_node = 9;                // 群归属节点（头像 blob 所在；跨节点 blob_get 寻址用）
}
// 群操作参数（method=group.create/join/leave/kick/set_meta/list 时装入 Command.params）。
message GroupOp {
  bytes group_id = 1;
  string name = 2;                    // create / set_meta 用
  bytes target = 3;                   // kick/add/promote/demote 用：目标成员
  string topic = 4;                   // set_meta 用：群简介
  string avatar_url = 5;              // set_meta 用：群头像引用
}
message GroupList { repeated Group groups = 1; }

// 频道 / 主题（P4）：iroh-gossip 主题上的开放 pub/sub（1→N 广播，订阅制，大规模）。
// 与「群」区别：群=封闭成员表、双向、小规模；频道=开放订阅、广播、可海量订阅者。
message Channel {
  bytes channel_id = 1;               // 32 字节频道标识
  string name = 2;
  bytes owner = 3;                    // 创建者（可定发布白名单 / 事后审核）
  int64 created_at = 4;
  string topic = 5;                   // 频道简介/主题
  string avatar_url = 6;              // 频道头像："b3:<hash>" 或内联 data:URI
  bytes home_node = 7;                // 频道创建者的家节点（头像 blob 所在；跨节点解析用）
}
// 频道消息（gossip 载荷 + 转发给订阅者）。sender 为发布者；seq 单调用于回填游标/去重。
message ChannelMsg {
  bytes channel_id = 1;
  bytes sender = 2;
  uint64 seq = 3;
  int64 ts = 4;
  string body = 5;
}
// 频道 gossip 载荷信封：消息 or 元信息（名称/简介/头像）广播，令订阅者收敛频道展示信息。
message ChannelGram {
  oneof kind {
    ChannelMsg msg = 1;               // 一条频道消息
    Channel meta = 2;                 // 频道元信息广播（owner/已知者周期重播，晚订阅者据此补全）
  }
}
message ChannelOp   { bytes channel_id = 1; string name = 2; string topic = 3; string avatar_url = 4; } // create/sub/set_meta 参数
message ChannelPub  { bytes channel_id = 1; string body = 2; }                    // publish 参数
message ChannelList { repeated Channel channels = 1; }
message ChannelBackfillReq { bytes channel_id = 1; uint64 since_seq = 2; }
message ChannelLog  { repeated ChannelMsg msgs = 1; }

// Job / 任务（算力网：训练、推理、批处理）
message ResourceReq { map<string, string> selectors = 1; }   // model / gpu / region / ...
message JobSpec { string job_type = 1; Any spec = 2; ResourceReq requirements = 3; }
message JobSubmit { bytes job_id = 1; JobSpec spec = 2; }
message JobEvent {
  bytes job_id = 1;
  enum State { STATE_QUEUED = 0; STATE_RUNNING = 1; STATE_PROGRESS = 2; STATE_SUCCEEDED = 3; STATE_FAILED = 4; STATE_CANCELED = 5; }
  State state = 2;
  float progress = 3;
  Any output = 4;
  string error = 5;
}

// 能力授权（代理/委托，UCAN 风格）：谁可对谁做什么，可过期/撤销/委托链。
message Grant {
  bytes issuer = 1;
  bytes audience = 2;
  string action = 3;
  string resource = 4;
  int64 expires = 5;
  bytes proof = 6;       // 上游委托链
  bytes signature = 7;
}
